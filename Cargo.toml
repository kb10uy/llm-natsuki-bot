[workspace]
resolver = "2"
members = [
  "lnb-core",
  "lnb-persistence-sqlite",
  "lnb-reminder-redis",
  "lnb-math-renderer-client",
  "lnb-user-policy",
  "lnb-rate-limiter",
  "lnb-daily-private",
  "lnb-server",
  "lnb-admin-api",
  "lnb-mastodon-client",
  "lnb-discord-client",
  "xtask",
]

[workspace.package]
version = "0.19.0"
description = "LLM-based chatbot with various functions"
authors = ["kb10uy <kb10uy@kb10uy.org>"]
edition = "2024"

[workspace.dependencies]
lnb-core = { path = "./lnb-core" }
lnb-persistence-sqlite = { path = "./lnb-persistence-sqlite" }
lnb-reminder-redis = { path = "./lnb-reminder-redis" }
lnb-math-renderer-client = { path = "./lnb-math-renderer-client" }
lnb-user-policy = { path = "./lnb-user-policy" }
lnb-rate-limiter = { path = "./lnb-rate-limiter" }
lnb-daily-private = { path = "./lnb-daily-private" }
lnb-mastodon-client = { path = "./lnb-mastodon-client" }
lnb-discord-client = { path = "./lnb-discord-client" }

anyhow = "1.0.104"
async-openai = { version = "0.41.3", features = ["chat-completion", "responses", "image"] }
base64 = "0.23.1"
bimap = "0.6.3"
clap = { version = "4.6.6", features = ["derive"] }
colored = "3.1.1"
futures = "0.3.34"
html2md = "0.2.17"
infer = "0.22.0"
markdown = "1.0.0"
pin-project = "1.1.13"
rand = "0.10.2"
rand_distr = "0.6.0"
redis = { version = "1.7.0", features = ["tokio-comp"] }
regex = "1.13.1"
reqwest = { version = "0.13.4", features = ["json"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_bytes = "0.11.19"
serde_json = "1.0.151"
sha2 = "0.11.0"
sqlx = { version = "0.9.0", features = [
  "runtime-tokio",
  "sqlite",
  "uuid",
  "time",
] }
tempfile = "3.27.0"
thiserror = "2.0.20"
time = { version = "0.3.55", features = [
  "formatting",
  "parsing",
  "local-offset",
  "macros",
  "serde",
] }
tokio = { version = "1.53.1", features = ["full"] }
tokio-stream = "0.1.19"
tokio-tungstenite = { version = "0.30.0", features = ["native-tls"] }
toml = "1.1.5"
tracing = "0.1.44"
tracing-subscriber = "0.3.23"
upon = "0.11.0"
url = { version = "2.5.8", features = ["serde"] }
uuid = { version = "1.26.0", features = ["serde", "v7"] }

[profile.release]
lto = true
opt-level = 3
strip = true
